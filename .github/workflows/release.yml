name: Release

# Tag a commit `v1.2.3` and this publishes the artifacts the in-app updater
# looks for. The asset names matter: UpdateService matches `.apk` on Android
# and `-macos.zip` on macOS (see lib/src/update/update_service.dart).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  version-check:
    name: Tag matches pubspec
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: read
        name: Compare the tag with pubspec.yaml
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "tag=$TAG pubspec=$PUBSPEC"
          if [ "${TAG#v}" != "$PUBSPEC" ]; then
            echo "::error::Tag $TAG does not match pubspec version $PUBSPEC."
            echo "The in-app updater compares the release tag against the"
            echo "version baked into the build, so they must agree."
            exit 1
          fi
          echo "version=$PUBSPEC" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/AttendanceTracker-${{ needs.version-check.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release

      - name: Zip the app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Attendance Tracker.app" \
            "dist/AttendanceTracker-${{ needs.version-check.outputs.version }}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version-check, android, macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: v${{ needs.version-check.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/macos/*.zip
